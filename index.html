<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Timer</title>
    <style>
        :root {
            /* -- VARIABLE TO CHANGE THE TIMER SIZE -- */
            --timer-font-size: 20rem;
            --bg-color: #2c3e50;
            --text-color: #ecf0f1;
            --font-family: 'Arial', sans-serif;
            /* ------------------------------------------ */
        }

        body {
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            font-family: var(--font-family);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        #timer {
            font-size: var(--timer-font-size);
            cursor: pointer;
            user-select: none;
            margin-bottom: 20px;
            transition: transform 0.1s ease-in-out, color 0.1s;
        }
        
        .timer-started-feedback {
            transform: scale(1.1);
            color: #2ecc71; /* Flash green */
        }

        .button-container {
            margin-top: 20px;
            display: flex;
            gap: 15px; /* Space between buttons */
        }

        .control-button {
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #testSoundButton {
            background-color: #3498db; /* Blue */
        }
        #testSoundButton:hover {
            background-color: #2980b9;
        }
        
        #resetButton {
            background-color: #e74c3c; /* Red */
        }
        #resetButton:hover {
            background-color: #c0392b;
        }

        .is-flashing {
            animation: flash 1s infinite;
        }

        @keyframes flash {
            0%, 100% {
                color: #e74c3c;
            }
            50% {
                color: var(--text-color);
            }
        }
        
        /* Config Menu Styles */
        #hiddenConfigTrigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 75px;
            height: 75px;
            cursor: default; /* Keep it feeling hidden */
            z-index: 9999;
        }

        #configModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffffff;
            color: #333333;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10000;
            width: 320px;
        }

        #configModal h2 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .config-row {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .config-row label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .config-row input, .config-row select {
            padding: 8px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #closeConfig {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        #closeConfig:hover {
            background-color: #27ae60;
        }
        
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9998;
        }
    </style>
</head>
<body>

    <!-- Hidden top-right corner trigger for config -->
    <div id="hiddenConfigTrigger"></div>

    <!-- Config Modal -->
    <div id="overlay"></div>
    <div id="configModal">
        <h2>Settings</h2>
        <div class="config-row">
            <label for="timeInput">Time (seconds):</label>
            <input type="number" id="timeInput" value="180" min="1">
        </div>
        <div class="config-row">
            <label for="fontSelect">Font Family:</label>
            <select id="fontSelect">
                <option value="'Arial', sans-serif">Arial</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Georgia', serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Verdana', sans-serif">Verdana</option>
                <option value="'Impact', sans-serif">Impact</option>
            </select>
        </div>
        <div class="config-row">
            <label for="songInput">Alarm Song (MP3 from disk):</label>
            <input type="file" id="songInput" accept=".mp3,audio/*">
        </div>
        <div class="config-row">
            <label for="bgColorInput">Background Color:</label>
            <input type="color" id="bgColorInput" value="#2c3e50">
        </div>
        <div class="config-row">
            <label for="textColorInput">Text Color:</label>
            <input type="color" id="textColorInput" value="#ecf0f1">
        </div>
        <button id="closeConfig">Save & Close</button>
    </div>

    <div id="timer">3:00</div>
    
    <div class="button-container">
        <button id="testSoundButton" class="control-button">Test Alarm</button>
        <button id="resetButton" class="control-button">Reset</button>
    </div>

    <script>
        const timerElement = document.getElementById('timer');
        const testButton = document.getElementById('testSoundButton');
        const resetButton = document.getElementById('resetButton');
        
        // Config Elements
        const hiddenConfigTrigger = document.getElementById('hiddenConfigTrigger');
        const configModal = document.getElementById('configModal');
        const overlay = document.getElementById('overlay');
        const closeConfig = document.getElementById('closeConfig');
        const timeInput = document.getElementById('timeInput');
        const fontSelect = document.getElementById('fontSelect');
        const songInput = document.getElementById('songInput');
        const bgColorInput = document.getElementById('bgColorInput');
        const textColorInput = document.getElementById('textColorInput');

        const alarmSounds = [
            'alarm.mp3',
			'viticulture.mp3',
			'courtly.mp3'
        ];

        // Create one single Audio object and use it for everything.
        const alarmSound = new Audio(alarmSounds[0]);

        let startingTime = 180; // 3 minutes in seconds
        let countdownTimer;
        let timeLeft = startingTime;
        let timerRunning = false;
        
        // --- SYNTHESIZE START SOUND ---
        function playStartTick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'sine';
                // A quick "plop" sound
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {
                console.log("AudioContext not supported for tick");
            }
        }
        
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            return `${minutes}:${seconds}`;
        }
        
        function updateTimer() {
            timerElement.textContent = formatTime(timeLeft);
            if (timeLeft === 0) {
                clearInterval(countdownTimer);
                playSound();
                timerElement.classList.add('is-flashing');
            } else {
                timeLeft--;
            }
        }

        function resetTimer() {
            // Stop the interval timer
            clearInterval(countdownTimer);

            // Stop and reset the sound if it's playing
            alarmSound.pause();
            alarmSound.currentTime = 0;
            
            // Reset state variables
            timerRunning = false;
            
            // Reset the display to the starting time
            timeLeft = startingTime;
            timerElement.textContent = formatTime(timeLeft);
            
            // Remove the flashing effect
            timerElement.classList.remove('is-flashing');
        }
        
        timerElement.addEventListener('click', () => {
            if (!timerRunning && timeLeft > 0) {
                timerRunning = true;
                
                // Silent unlock
                alarmSound.play().catch(() => {});
                alarmSound.pause();
                
                // Play small start sound and show visual feedback
                playStartTick();
                timerElement.classList.add('timer-started-feedback');
                setTimeout(() => {
                    timerElement.classList.remove('timer-started-feedback');
                }, 150);
                
                countdownTimer = setInterval(updateTimer, 1000);
            }
        });
        
        testButton.addEventListener('click', () => {
            playSound();
        });

        resetButton.addEventListener('click', resetTimer);

        function playSound() {
            alarmSound.currentTime = 0; // Rewind to the start
            alarmSound.play().catch((err) => console.log("Audio play prevented:", err));
        }
        
        // --- CONFIG MENU LOGIC ---
        hiddenConfigTrigger.addEventListener('click', () => {
            configModal.style.display = 'block';
            overlay.style.display = 'block';
        });

        closeConfig.addEventListener('click', () => {
            configModal.style.display = 'none';
            overlay.style.display = 'none';
            
            // Apply time change if valid
            const newTime = parseInt(timeInput.value, 10);
            if (!isNaN(newTime) && newTime > 0) {
                startingTime = newTime;
                if (!timerRunning) {
                    resetTimer();
                }
            }

            // Apply style changes via CSS variables
            document.documentElement.style.setProperty('--font-family', fontSelect.value);
            document.documentElement.style.setProperty('--bg-color', bgColorInput.value);
            document.documentElement.style.setProperty('--text-color', textColorInput.value);
        });

        // Load new MP3 from disk
        songInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const objectURL = URL.createObjectURL(file);
                alarmSound.src = objectURL; // Replace the source of our existing audio element
            }
        });

        // --- INITIAL SETUP ---
        timerElement.textContent = formatTime(timeLeft);
    </script>
</body>
</html>
